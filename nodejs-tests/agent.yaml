---
name: nodejs-tests
version: 0.1.0
description: Autonomous Node.js/TypeScript test coverage agent that discovers gaps, writes tests, and iterates to a target percentage. Always analyzes coverage even if target is met.
models:
  - model: claude-sonnet-4-6
    provider: anthropic
  - model: gpt-4.1-mini
    provider: openai
  - model: gemini-2.5-flash
    provider: google
disable_task: true
entrypoint: system.md
wrapper: agent.md
references:
  - references/nodejs-testing-patterns.md
task: task.md
budget:
  estimated_iterations: 30
  scale_factor: files
  files_per_iteration: 2
requires:
  commands:
    - name: npm
      install:
        brew: node
        url: https://nodejs.org/en/download
