---
name: go-pipeline
version: 0.2.0
description: Orchestrator agent that runs go-review, go-tests, go-doc-comments, and optionally go-cobra sequentially with context passing to avoid redundant work.
entrypoint: system.md
wrapper: agent.md
task: task.md
budget:
  max_tokens: 16384
  estimated_iterations: 10
  children:
    - name: go-cobra
      max_cost: 3.00
    - name: go-review
      max_cost: 5.00
    - name: go-tests
      max_cost: 8.00
    - name: go-doc-comments
      max_cost: 3.00
