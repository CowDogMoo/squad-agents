---
name: go-pipeline
version: 0.3.0
description: Sequential Go quality pipeline — review, tests, doc comments, and optionally Cobra fixes.

stages:
  - name: cobra
    agent: go-cobra
  - name: review
    agent: go-review
    depends_on: [cobra]
  - name: tests
    agent: go-tests
    depends_on: [review]
  - name: docs
    agent: go-doc-comments
    depends_on: [tests]

gates:
  - after: tests
    command: "go test ./..."
    on_failure: stop
  - after: docs
    command: "go build ./..."
    on_failure: stop

requires:
  commands:
    - name: go
      install:
        brew: go
        url: https://go.dev/doc/install
