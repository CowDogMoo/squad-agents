---
name: Validate Agents
on:
  merge_group:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '**/agent.yaml'
      - '**/system.md'
      - '**/agent.md'
      - '**/task.md'
      - '**/references/**'
      - '_templates/**'
      - '.github/workflows/validate-agents.yaml'
  push:
    branches:
      - main
    paths:
      - '**/agent.yaml'
      - '**/system.md'
      - '**/agent.md'
      - '**/task.md'
      - '**/references/**'
      - '_templates/**'
      - '.github/workflows/validate-agents.yaml'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13.7"

jobs:
  validate:
    name: Validate Agent Configurations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout git repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install pyyaml

      - name: Find all agents
        id: find-agents
        run: |
          agents=$(find . -name 'agent.yaml' -not -path './_templates/*' -type f)
          echo "Found agents:"
          echo "$agents"
          {
            echo "agents<<EOF"
            echo "$agents"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check required files
        run: |
          failed=0
          while IFS= read -r agent_yaml; do
            if [ -z "$agent_yaml" ]; then
              continue
            fi
            agent_dir=$(dirname "$agent_yaml")
            agent_name=$(basename "$agent_dir")
            echo "::group::Checking $agent_name"

            # agent.yaml is always required
            if [ ! -f "${agent_dir}/agent.yaml" ]; then
              echo "::error file=${agent_yaml}::Missing required file agent.yaml in ${agent_name}"
              failed=1
            else
              echo "  ✓ agent.yaml"
            fi

            # Check if this is a composed agent (has stages: in agent.yaml)
            if grep -q '^stages:' "${agent_dir}/agent.yaml"; then
              echo "  ℹ Composed agent — skipping leaf file checks"
            else
              for required_file in agent.md system.md task.md; do
                if [ ! -f "${agent_dir}/${required_file}" ]; then
                  echo "::error file=${agent_yaml}::Missing required file ${required_file} in ${agent_name}"
                  failed=1
                else
                  echo "  ✓ ${required_file}"
                fi
              done
            fi

            echo "::endgroup::"
          done < <(find . -name 'agent.yaml' -not -path './_templates/*' -type f)

          if [ $failed -eq 1 ]; then
            echo "::error::One or more agents are missing required files"
            exit 1
          fi
          echo "✓ All agents have required files"

      - name: Validate YAML syntax
        run: |
          pip install yamllint
          find . -name 'agent.yaml' -not -path './_templates/*' | while read -r file; do
            echo "Checking YAML syntax: $file"
            yamllint -d "{extends: relaxed, rules: {line-length: {max: 120}}}" "$file"
          done

  metadata-check:
    name: Check Agent Metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout git repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check metadata completeness
        run: |
          python << 'EOF'
          import yaml
          import sys
          from pathlib import Path

          # Common fields required by all agents
          common_fields = ['name', 'version', 'description']
          # Additional fields required only by leaf agents (not composed)
          leaf_fields = ['entrypoint', 'wrapper', 'task']
          failed = False

          agent_files = sorted(
              p for p in Path('.').rglob('agent.yaml')
              if '_templates' not in p.parts
          )

          for agent_file in agent_files:
              agent_name = agent_file.parent.name
              print(f"\n{'='*60}")
              print(f"Checking metadata in: {agent_file} ({agent_name})")
              print('='*60)

              with open(agent_file) as f:
                  data = yaml.safe_load(f)

              is_composed = 'stages' in data and data['stages']
              agent_type = 'composed' if is_composed else 'leaf'
              print(f"  ℹ Agent type: {agent_type}")

              for field in common_fields:
                  if field not in data or not data[field]:
                      print(f"  ✗ Missing required field: {field}")
                      failed = True
                  else:
                      print(f"  ✓ {field}: {data[field]}")

              if is_composed:
                  # Composed agents must have stages, must NOT have entrypoint
                  if data.get('entrypoint'):
                      print(f"  ✗ Composed agent must not have entrypoint")
                      failed = True
                  for stage in data['stages']:
                      if not stage.get('name'):
                          print(f"  ✗ Stage missing name")
                          failed = True
                      elif stage.get('entrypoint'):
                          # Inline stage — has its own entrypoint
                          print(f"  ✓ stage (inline): {stage['name']}")
                      elif not stage.get('agent') and not stage.get('agents'):
                          print(f"  ✗ Stage '{stage.get('name')}' must specify agent, agents, or inline entrypoint")
                          failed = True
                      else:
                          print(f"  ✓ stage: {stage['name']}")
              else:
                  # Leaf agents require entrypoint, wrapper, task
                  for field in leaf_fields:
                      if field not in data or not data[field]:
                          print(f"  ✗ Missing required field: {field}")
                          failed = True
                      else:
                          print(f"  ✓ {field}: {data[field]}")

              # Validate version follows semver pattern
              version = data.get('version', '')
              if version:
                  import re
                  if not re.match(r'^\d+\.\d+\.\d+$', version):
                      print(f"  ✗ Version '{version}' does not follow semver (X.Y.Z)")
                      failed = True

              # Validate name matches directory
              name = data.get('name', '')
              if name and name != agent_name:
                  print(f"  ✗ Name '{name}' does not match directory '{agent_name}'")
                  failed = True

              # Validate budget fields if present
              budget = data.get('budget', {})
              if budget:
                  print(f"  ✓ budget: {list(budget.keys())}")
                  if 'estimated_iterations' in budget:
                      if not isinstance(budget['estimated_iterations'], int):
                          print(f"  ✗ estimated_iterations must be an integer")
                          failed = True
                  if 'max_tokens' in budget:
                      if not isinstance(budget['max_tokens'], int):
                          print(f"  ✗ max_tokens must be an integer")
                          failed = True

          if failed:
              print(f"\n::error::One or more agents have incomplete or invalid metadata")
              sys.exit(1)
          else:
              print(f"\n✓ All agents have complete and valid metadata")
          EOF

  reference-check:
    name: Check Agent References
    runs-on: ubuntu-latest

    steps:
      - name: Checkout git repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate referenced files exist
        run: |
          python << 'EOF'
          import yaml
          import sys
          from pathlib import Path

          failed = False

          agent_files = sorted(
              p for p in Path('.').rglob('agent.yaml')
              if '_templates' not in p.parts
          )

          for agent_file in agent_files:
              agent_dir = agent_file.parent
              agent_name = agent_dir.name
              print(f"\n{'='*60}")
              print(f"Checking references in: {agent_name}")
              print('='*60)

              with open(agent_file) as f:
                  data = yaml.safe_load(f)

              is_composed = 'stages' in data and data['stages']

              if is_composed:
                  # Composed agents: validate stage references
                  print(f"  ℹ Composed agent — checking stage references")
                  for stage in data['stages']:
                      stage_name = stage.get('name', '?')

                      # Inline stages: check prompt files exist
                      if stage.get('entrypoint'):
                          for field in ['entrypoint', 'wrapper', 'task']:
                              val = stage.get(field, '')
                              if val:
                                  path = agent_dir / val
                                  if path.exists():
                                      print(f"    ✓ {stage_name}/{field}: {val}")
                                  else:
                                      print(f"    ✗ {stage_name}/{field} not found: {path}")
                                      failed = True
                          for ref in stage.get('references', []):
                              path = agent_dir / ref
                              if path.exists():
                                  print(f"    ✓ {stage_name}/ref: {ref}")
                              else:
                                  print(f"    ✗ {stage_name}/ref not found: {path}")
                                  failed = True
                      else:
                          # External agent references
                          agents = []
                          if stage.get('agent'):
                              agents = [stage['agent']]
                          elif stage.get('agents'):
                              agents = stage['agents']
                          for sub_agent in agents:
                              sibling_dir = agent_dir.parent / sub_agent
                              if sibling_dir.exists() and (sibling_dir / 'agent.yaml').exists():
                                  print(f"    ✓ sub-agent: {sub_agent}")
                              else:
                                  print(f"    ✗ sub-agent not found: {sub_agent}")
                                  failed = True
              else:
                  # Leaf agents: validate file references
                  # Check entrypoint file exists
                  entrypoint = data.get('entrypoint', '')
                  if entrypoint:
                      path = agent_dir / entrypoint
                      if path.exists():
                          print(f"  ✓ entrypoint: {entrypoint}")
                      else:
                          print(f"  ✗ entrypoint not found: {path}")
                          failed = True

                  # Check wrapper file exists
                  wrapper = data.get('wrapper', '')
                  if wrapper:
                      path = agent_dir / wrapper
                      if path.exists():
                          print(f"  ✓ wrapper: {wrapper}")
                      else:
                          print(f"  ✗ wrapper not found: {path}")
                          failed = True

                  # Check task file exists
                  task = data.get('task', '')
                  if task:
                      path = agent_dir / task
                      if path.exists():
                          print(f"  ✓ task: {task}")
                      else:
                          print(f"  ✗ task not found: {path}")
                          failed = True

                  # Check all reference files exist
                  references = data.get('references', [])
                  if references:
                      for ref in references:
                          path = agent_dir / ref
                          if path.exists():
                              print(f"  ✓ reference: {ref}")
                          else:
                              print(f"  ✗ reference not found: {path}")
                              failed = True
                  else:
                      print(f"  ⚠ No references defined")

          if failed:
              print(f"\n::error::One or more agents have missing referenced files")
              sys.exit(1)
          else:
              print(f"\n✓ All agent references are valid")
          EOF

  compliance-check:
    name: Check Architecture Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout git repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check prompt file line counts
        run: |
          shopt -s nullglob
          failed=0
          SYSTEM_MAX=300
          AGENT_MAX=50
          TASK_MAX=30

          check_limit() {
            local file="$1" max="$2" kind="$3"
            if [ ! -f "$file" ]; then return; fi
            count=$(wc -l < "$file" | tr -d ' ')
            if [ "$count" -gt "$max" ]; then
              echo "::error file=${file}::${kind} has ${count} lines (limit ${max})"
              return 1
            fi
            return 0
          }

          while IFS= read -r agent_yaml; do
            dir=$(dirname "$agent_yaml")

            if grep -q '^stages:' "$agent_yaml"; then
              # Composed agent: check stage files
              for f in "$dir"/*-system.md; do
                [ -f "$f" ] && check_limit "$f" $SYSTEM_MAX "system prompt" || failed=1
              done
              for f in "$dir"/*-agent.md; do
                [ -f "$f" ] && check_limit "$f" $AGENT_MAX "agent wrapper" || failed=1
              done
              for f in "$dir"/*-task.md; do
                [ -f "$f" ] && check_limit "$f" $TASK_MAX "task file" || failed=1
              done
              # Also check stages/ subdirectory layout
              for f in "$dir"/stages/*/system.md; do
                [ -f "$f" ] && check_limit "$f" $SYSTEM_MAX "system prompt" || failed=1
              done
              for f in "$dir"/stages/*/agent.md; do
                [ -f "$f" ] && check_limit "$f" $AGENT_MAX "agent wrapper" || failed=1
              done
              for f in "$dir"/stages/*/task.md; do
                [ -f "$f" ] && check_limit "$f" $TASK_MAX "task file" || failed=1
              done

              # Pipeline agents (stages referencing external agents) have no prompt files
              if grep -qE '^\s+agent:' "$agent_yaml" && ! grep -qE '^\s+entrypoint:' "$agent_yaml"; then
                continue
              fi
            else
              # Leaf agent
              check_limit "$dir/system.md" $SYSTEM_MAX "system prompt" || failed=1
              check_limit "$dir/agent.md" $AGENT_MAX "agent wrapper" || failed=1
              check_limit "$dir/task.md" $TASK_MAX "task file" || failed=1
            fi
          done < <(find . -name 'agent.yaml' -not -path './_templates/*' -type f)

          if [ $failed -eq 1 ]; then
            echo "::error::One or more prompt files exceed line count limits"
            exit 1
          fi
          echo "✓ All prompt files within line count limits"

      - name: Check required sections
        run: |
          failed=0

          check_section() {
            local file="$1" pattern="$2" label="$3"
            if ! grep -qiE "$pattern" "$file"; then
              echo "::error file=${file}::Missing required section: ${label}"
              return 1
            fi
            return 0
          }

          while IFS= read -r agent_yaml; do
            dir=$(dirname "$agent_yaml")

            # Skip pipeline agents
            if grep -q '^stages:' "$agent_yaml"; then
              if grep -qE '^\s+agent:' "$agent_yaml" && ! grep -qE '^\s+entrypoint:' "$agent_yaml"; then
                continue
              fi
            fi

            # Find all system.md files for this agent
            system_files=()
            agent_files=()
            if grep -q '^stages:' "$agent_yaml"; then
              for f in "$dir"/*-system.md "$dir"/stages/*/system.md; do
                [ -f "$f" ] && system_files+=("$f")
              done
              for f in "$dir"/*-agent.md "$dir"/stages/*/agent.md; do
                [ -f "$f" ] && agent_files+=("$f")
              done
            else
              [ -f "$dir/system.md" ] && system_files=("$dir/system.md")
              [ -f "$dir/agent.md" ] && agent_files=("$dir/agent.md")
            fi

            for f in "${system_files[@]}"; do
              check_section "$f" '^#.*(IDENTITY|IDENTITY and PURPOSE)' "IDENTITY" || failed=1
              check_section "$f" '^#.*HARD RULES' "HARD RULES" || failed=1
              check_section "$f" '^#.*WORKFLOW' "WORKFLOW" || failed=1
              check_section "$f" '^#.*INPUT' "INPUT" || failed=1
              if ! grep -qE '(^#.*OUTPUT FORMAT|include.*output/.*format)' "$f"; then
                echo "::error file=${f}::Missing required section: OUTPUT FORMAT"
                failed=1
              fi
            done

            for f in "${agent_files[@]}"; do
              check_section "$f" '^#.*EXECUTION RULES' "EXECUTION RULES" || failed=1
              check_section "$f" '^#.*OUTPUT COMPLIANCE' "OUTPUT COMPLIANCE" || failed=1
            done
          done < <(find . -name 'agent.yaml' -not -path './_templates/*' -type f)

          if [ $failed -eq 1 ]; then
            echo "::error::One or more prompt files are missing required sections"
            exit 1
          fi
          echo "✓ All prompt files have required sections"

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validate, metadata-check, reference-check, compliance-check]
    if: always()

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.validate.result }}" != "success" ] || \
             [ "${{ needs.metadata-check.result }}" != "success" ] || \
             [ "${{ needs.reference-check.result }}" != "success" ] || \
             [ "${{ needs.compliance-check.result }}" != "success" ]; then
            echo "::error::Agent validation failed"
            echo ""
            echo "Job Results:"
            echo "  validate: ${{ needs.validate.result }}"
            echo "  metadata-check: ${{ needs.metadata-check.result }}"
            echo "  reference-check: ${{ needs.reference-check.result }}"
            echo "  compliance-check: ${{ needs.compliance-check.result }}"
            exit 1
          fi
          echo "✓ All agent validations passed"
