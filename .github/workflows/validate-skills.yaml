---
name: Validate Skills
on:
  merge_group:
  # No `paths` filter on pull_request: if the summary job is ever made a
  # required status check on main, a filtered-out workflow never reports,
  # which would leave non-skill PRs unmergeable. The job only scans
  # prompts, so running on every PR is correct and costs ~30s.
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
    paths:
      - "scripts/check_skill_refs.py"
      - "**/*.md"
      - "**/*.yaml"
      - ".github/workflows/validate-skills.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Every skill these agents load lives in squad-skills, which validates
  # the skills themselves. This repo only checks that each skill a
  # prompt names (frontmatter `skills:` or a Skill() call) exists there,
  # otherwise the agent's mandatory first iteration fails at runtime.
  skill-refs:
    name: Skill References
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout squad-skills
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CowDogMoo/squad-skills
          path: .squad-skills
          persist-credentials: false

      - name: Check Skill() references resolve
        run: python3 scripts/check_skill_refs.py --skills-dir .squad-skills

  # Named "Skill Validation Summary" (not "Validation Summary") because
  # validate-agents.yaml already produces a check run with that name.
  summary:
    name: Skill Validation Summary
    runs-on: ubuntu-latest
    needs: [skill-refs]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.skill-refs.result }}" != "success" ]; then
            echo "::error::Skill validation failed (skill-refs: ${{ needs.skill-refs.result }})"
            exit 1
          fi
          echo "✓ All skill validations passed"
