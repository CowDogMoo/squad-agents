---
name: Validate Skills
on:
  merge_group:
  # No `paths` filter on pull_request: if the summary job is ever made a
  # required status check on main, a filtered-out workflow never reports,
  # which would leave non-skill PRs unmergeable. The jobs only scan
  # skills/, so running on every PR is correct and costs ~30s.
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'scripts/check_skill_refs.py'
      - '**/*.md'
      - '**/*.yaml'
      - '.github/workflows/validate-skills.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The validation logic lives in squad-skills so both repos run the same
  # checks without a drifting copy. Skills here live under skills/.
  skills:
    name: Skills
    uses: CowDogMoo/squad-skills/.github/workflows/reusable-validate-skills.yaml@1ad886c654d22f80d85fa8e1f95dbd7756328f5e # main
    with:
      skills-dir: skills

  # Every skill a prompt loads by name must exist in skills/ or squad-skills,
  # otherwise the agent's mandatory first iteration fails at runtime.
  skill-refs:
    name: Skill References
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout squad-skills
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CowDogMoo/squad-skills
          path: .squad-skills
          persist-credentials: false

      - name: Check Skill() references resolve
        run: python3 scripts/check_skill_refs.py --skills-dir .squad-skills

  # Named "Skill Validation Summary" (not "Validation Summary") because
  # validate-agents.yaml already produces a check run with that name.
  summary:
    name: Skill Validation Summary
    runs-on: ubuntu-latest
    needs: [skills, skill-refs]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.skills.result }}" != "success" ] || [ "${{ needs.skill-refs.result }}" != "success" ]; then
            echo "::error::Skill validation failed (skills: ${{ needs.skills.result }}, skill-refs: ${{ needs.skill-refs.result }})"
            exit 1
          fi
          echo "✓ All skill validations passed"
