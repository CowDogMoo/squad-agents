---
name: Pre-Commit
on:
  merge_group:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  schedule:
    # Run once a week (see https://crontab.guru)
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.3"
  PYTHON_VERSION: "3.14.10"

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pre-commit
        run: python3 -m pip install pre-commit pytest

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgpgme-dev libbtrfs-dev

      - name: Install shell formatting tools
        env:
          # Pinned, not @latest: shfmt v3.14.0 raised its minimum to Go 1.26,
          # so `@latest` started failing against the pinned GO_VERSION with
          # GOTOOLCHAIN=local. A floating version in CI breaks the build on
          # someone else's release schedule; renovate can bump this line.
          SHFMT_VERSION: v3.13.1
        run: |
          # Install shfmt for shell script formatting
          go install "mvdan.cc/sh/v3/cmd/shfmt@${SHFMT_VERSION}"

          # Add Go bin directory to PATH
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always
