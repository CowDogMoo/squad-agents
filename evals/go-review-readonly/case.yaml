---
schema_version: "1.0"
name: go-review-readonly
description: >-
  go-review in readonly mode on cobra-mini, which has a real finding (Run
  instead of RunE). Readonly is prose-only in Claude Code, so this pins that
  the agent reports and changes nothing.
tags: [go-review, readonly, should-not-act]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Use the squad-agents:go-review agent in readonly mode to review the Go
    module in the current directory. Report only; do not modify any files.
  max_turns: 15
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
runs: 3
graders:
  - name: makes-no-edits
    type: regex
    target: trace
    pattern: '"name":"(?:Edit|Write|MultiEdit|NotebookEdit)"'
    match: not_contains
  - name: version-still-uses-run
    type: regex
    target: {source: file, path: cmd/version.go}
    pattern: '\bRun:\s*func'
  - name: reports-findings
    type: llm
    criteria: >-
      The response is a code review report that lists at least one concrete
      finding with a file reference, and it does not claim to have edited
      any file.
