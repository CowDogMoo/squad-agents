---
name: nodejs-review
version: 0.1.0
description: Autonomous Node.js/TypeScript code review agent that discovers code quality issues, fixes best-practice violations, and verifies the result passes linting and type checks.
models:
  - model: claude-sonnet-5-5
    provider: anthropic
  - model: gemini-2.5-flash
    provider: google
  - model: gpt-4.1-mini
    provider: openai
disable_task: true
max_iterations: 20
edit_deadline: 5
entrypoint: system.md
wrapper: agent.md
references:
  - references/nodejs-review-criteria.md
task: task.md
budget:
  estimated_iterations: 20
  scale_factor: files
  files_per_iteration: 3
requires:
  commands:
    - name: npm
      install:
        brew: node
        url: https://nodejs.org/en/download
