---
name: python-review
version: 0.2.0
description: Autonomous Python code review agent that discovers code quality issues, fixes best-practice violations, and verifies the result passes linting.
models:
  - model: claude-sonnet-4-6
    provider: anthropic
  - model: gemini-2.5-flash
    provider: google
  - model: gpt-4.1-mini
    provider: openai
disable_task: true
entrypoint: system.md
wrapper: agent.md
references:
  - references/python-review-criteria.md
task: task.md
budget:
  estimated_iterations: 20
  scale_factor: files
  files_per_iteration: 3
requires:
  commands:
    - name: python
      install:
        brew: python
        url: https://www.python.org/downloads
    - name: pytest
      install:
        pipx: pytest
        pip: pytest
        url: https://docs.pytest.org
