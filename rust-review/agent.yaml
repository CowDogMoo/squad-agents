---
name: rust-review
version: 0.2.0
description: Autonomous Rust code review agent that discovers code quality issues, fixes best-practice violations, and verifies the result compiles.
models:
  - model: claude-sonnet-4-6
    provider: anthropic
  - model: gemini-2.5-flash
    provider: google
  - model: gpt-4.1-mini
    provider: openai
disable_task: true
max_iterations: 20
edit_deadline: 4
entrypoint: system.md
wrapper: agent.md
references:
  - references/rust-review-criteria.md
task: task.md
budget:
  estimated_iterations: 20
  scale_factor: files
  files_per_iteration: 3
requires:
  commands:
    - name: cargo
      install:
        brew: rust
        url: https://www.rust-lang.org/tools/install
