---
name: taskfile-review
version: 0.2.0
description: Autonomous Taskfile review agent that discovers configuration issues, fixes best-practice violations, and verifies the result parses correctly.
models:
  - model: claude-sonnet-4-6
    provider: anthropic
  - model: gpt-4.1-mini
    provider: openai
  - model: gemini-2.5-flash
    provider: google
entrypoint: system.md
wrapper: agent.md
references:
  - references/taskfile-best-practices.md
  - references/taskfile-standards.md
task: task.md
disable_task: true
requires:
  commands:
    - name: task
      install:
        brew: go-task
        go: github.com/go-task/task/v3/cmd/task@latest
        url: https://taskfile.dev/installation/
