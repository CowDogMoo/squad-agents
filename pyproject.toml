[project]
name = "squad-agents"
version = "0.1.0"
description = "Squad agents plus the shared output filter for the text-transform agents"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
    "pre-commit>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Only the shared filter and its tests are linted; skills/**/evals/files hold
# intentionally bad fixture code that the security agents are tested against.
include = ["scripts/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "A", "C4", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
