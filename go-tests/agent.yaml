---
name: go-tests
version: 0.6.1
description: Autonomous Go test coverage agent that discovers gaps, writes tests, and iterates to a target percentage. Always analyzes coverage even if target is met.
models:
  - model: claude-sonnet-5-5
    provider: anthropic
  - model: gpt-4.1-mini
    provider: openai
  - model: gemini-2.5-flash
    provider: google
disable_task: true
max_iterations: 200
entrypoint: system.md
wrapper: agent.md
task: task.md
budget:
  estimated_iterations: 30
  scale_factor: files
  files_per_iteration: 2
requires:
  commands:
    - name: go
      install:
        brew: go
        url: https://go.dev/doc/install
