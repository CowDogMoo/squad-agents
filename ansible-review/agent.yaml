---
name: ansible-review
version: 0.2.0
description: Autonomous Ansible code review agent that discovers quality issues, security anti-patterns, and best-practice violations in playbooks, roles, and collections.
models:
  - model: claude-sonnet-4-6
    provider: anthropic
  - model: gemini-2.5-flash
    provider: google
  - model: gpt-4.1-mini
    provider: openai
entrypoint: system.md
wrapper: agent.md
references:
  - references/ansible-standards.md
  - references/ansible-review-criteria.md
task: task.md
disable_task: true
requires:
  commands:
    - name: ansible-playbook
      install:
        brew: ansible
        pipx: ansible
        url: https://docs.ansible.com/ansible/latest/installation_guide
