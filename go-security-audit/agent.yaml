---
name: go-security-audit
version: 0.3.0
description: Parallel security audit — injection + resources agents run concurrently

stages:
  - name: audit
    agents:
      - go-security-injection
      - go-security-resources

gates:
  - after: audit
    command: "go build ./..."
    on_failure: stop
  - after: audit
    command: "go test ./..."
    on_failure: stop
