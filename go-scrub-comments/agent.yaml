---
name: go-scrub-comments
version: 0.1.0
description: Autonomous agent that scans Go source files for useless, LLM-generated, and non-idiomatic comments and deletes them.
models:
  - model: claude-opus-4-6
    provider: anthropic
  - model: claude-sonnet-4-6
    provider: anthropic
  - model: gpt-4.1-mini
    provider: openai
  - model: gemini-2.5-flash
    provider: google
entrypoint: system.md
wrapper: agent.md
task: task.md
disable_task: true
comments_only: true
budget:
  estimated_iterations: 45
  scale_factor: files
  files_per_iteration: 5
requires:
  commands:
    - name: go
      install:
        brew: go
        url: https://go.dev/doc/install
