---
name: nodejs-security-audit
version: 0.1.0
description: Parallel security audit — injection + resources stages run concurrently

stages:
  - name: injection
    entrypoint: injection-system.md
    wrapper: injection-agent.md
    task: injection-task.md
    max_cost: 2.00
    models:
      - model: claude-sonnet-5-5
        provider: anthropic
  - name: resources
    entrypoint: resources-system.md
    wrapper: resources-agent.md
    task: resources-task.md
    max_cost: 2.00
    models:
      - model: claude-sonnet-5-5
        provider: anthropic

gates:
  - after: injection
    command: "[ ! -f package.json ] || npm run build --if-present"
    on_failure: stop
  - after: injection
    command: "[ ! -f package.json ] || [ ! -f tsconfig.json ] || npx --no-install tsc --noEmit"
    on_failure: stop
  - after: resources
    command: "[ ! -f package.json ] || npm run build --if-present"
    on_failure: stop
  - after: resources
    command: "[ ! -f package.json ] || [ ! -f tsconfig.json ] || npx --no-install tsc --noEmit"
    on_failure: stop
  - after: resources
    command: |
      [ ! -f package.json ] || node -e '
        const test = (require("./package.json").scripts || {}).test;
        if (!test || test === "echo \"Error: no test specified\" && exit 1") process.exit(0);
        const flag = /(^|\s)(jest|vitest)(\s[^&|;]*)?$/.test(test) ? ["--", "--passWithNoTests"] : [];
        const run = require("child_process").spawnSync("npm", ["test", ...flag], { stdio: "inherit" });
        process.exit(run.status ?? 1);
      '
    on_failure: stop

requires:
  commands:
    - name: npm
      install:
        brew: node
        url: https://nodejs.org/en/download
