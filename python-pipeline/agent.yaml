---
name: python-pipeline
version: 0.3.0
description: Sequential Python quality pipeline — review, tests, doc comments.

stages:
  - name: review
    agent: python-review
  - name: tests
    agent: python-tests
    depends_on: [review]
  - name: docs
    agent: python-doc-comments
    depends_on: [tests]

gates:
  - after: tests
    command: "python -m pytest"
    on_failure: stop
